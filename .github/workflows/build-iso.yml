name: Build NOVA GAMER OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Compilar ISO dentro de container Debian 13 (privilegiado)
        timeout-minutes: 120
        run: |
          set -euo pipefail
          mkdir -p build
          docker run --rm --privileged -v "$PWD":/work -w /work debian:trixie bash -euxo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap xorriso squashfs-tools \
              syslinux syslinux-utils isolinux grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
              ca-certificates gnupg debian-archive-keyring file
            chmod +x scripts/*.sh config/hooks/live/*.hook.chroot
            ./scripts/build-iso.sh
          '

      - name: Validar estrutura da ISO
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools file
          chmod +x scripts/*.sh
          sudo ./scripts/validate-iso.sh build/NOVA-GAMER-OS-amd64.iso | tee build/VALIDATE-LOG.txt

      - name: Teste de boot em QEMU (BIOS e UEFI) com diagnóstico visual
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf socat python3
          sudo chmod a+rw /dev/kvm || true
          ./scripts/qemu-boot-test.sh build/NOVA-GAMER-OS-amd64.iso | tee build/QEMU-LOG.txt

      - name: Publicar ISO e todos os diagnósticos
        if: always()
        timeout-minutes: 30
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GAMER-OS
          if-no-files-found: warn
          path: |
            build/NOVA-GAMER-OS-amd64.iso
            build/SHA256SUMS.txt
            build/BUILD-LOG.txt
            build/VALIDATE-LOG.txt
            build/QEMU-LOG.txt
            build/qemu/*.ppm
            build/qemu/*.png
            build/qemu/*.log

      - name: Resumo automático do resultado
        if: always()
        run: |
          {
            echo "## NOVA GAMER OS - resultado da compilação"
            echo ""
            echo "- ISO: $([ -s build/NOVA-GAMER-OS-amd64.iso ] && echo criada || echo ausente)"
            echo "- Validação estrutural: $([ -s build/VALIDATE-LOG.txt ] && grep -q 'validação estrutural concluída' build/VALIDATE-LOG.txt && echo aprovada || echo não aprovada)"
            echo "- Teste de boot: $([ -s build/QEMU-LOG.txt ] && grep -q '\[OK\]' build/QEMU-LOG.txt && ! grep -q '\[FALHA\]' build/QEMU-LOG.txt && echo aprovado || echo reprovado ou incompleto)"
            echo ""
            echo "### Diagnóstico do QEMU"
            if [ -s build/QEMU-LOG.txt ]; then tail -n 50 build/QEMU-LOG.txt; else echo "Log QEMU não foi criado."; fi
          } >> "$GITHUB_STEP_SUMMARY"
